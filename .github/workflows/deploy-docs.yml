name: Deploy Documentation to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-cloudflare:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package.json

      - name: Install documentation dependencies
        working-directory: docs
        run: npm install

      - name: Build static documentation bundle
        working-directory: docs
        run: npm run build

      - name: Check Cloudflare Token
        id: check-token
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "token_present=false" >> $GITHUB_OUTPUT
            echo "::warning ::CLOUDFLARE_API_TOKEN secret is not set in GitHub repository settings. Set this secret to enable automated deployment."
          else
            echo "token_present=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare
        if: steps.check-token.outputs.token_present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9940e02785a980e66588b4cbbe0436c6' }}
          workingDirectory: docs
          command: deploy
