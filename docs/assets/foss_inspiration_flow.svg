<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Left: Open-Source Inspiration -->
  <g transform="translate(30, 20)">
    <rect width="230" height="280" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="230" height="36" rx="8" fill="#f1f5f9"/>
    <text x="115" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">OPEN-SOURCE INSPIRATION</text>
    
    <g transform="translate(15, 50)" font-family="monospace" font-size="11" fill="#334155">
      <rect width="200" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="16" font-weight="bold" fill="#0284c7">wireshark</text>
      <text x="10" y="28" font-size="10" fill="#64748b">packet-mbtcp, j1939, canopen</text>

      <g transform="translate(0, 42)">
        <rect width="200" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="10" y="16" font-weight="bold" fill="#0284c7">can-utils</text>
        <text x="10" y="28" font-size="10" fill="#64748b">cansniffer.c delta &amp; notch</text>
      </g>

      <g transform="translate(0, 84)">
        <rect width="200" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="10" y="16" font-weight="bold" fill="#0284c7">SavvyCAN</text>
        <text x="10" y="28" font-size="10" fill="#64748b">Interval histogram &amp; jitter</text>
      </g>

      <g transform="translate(0, 126)">
        <rect width="200" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="10" y="16" font-weight="bold" fill="#0284c7">CaringCaribou</text>
        <text x="10" y="28" font-size="10" fill="#64748b">Bus load % &amp; Tier-0 sniffing</text>
      </g>

      <g transform="translate(0, 168)">
        <rect width="200" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="10" y="16" font-weight="bold" fill="#0284c7">can-dbc / Zeek</text>
        <text x="10" y="28" font-size="10" fill="#64748b">Intel/Motorola unpack &amp; audit</text>
      </g>
    </g>
  </g>

  <!-- Middle: Clean-Room Specifications -->
  <g transform="translate(310, 80)">
    <rect width="200" height="160" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="100" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">DESIGN FOUNDATIONS</text>
    <text x="100" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Timing Constants (t1.5, t3.5)</text>
    <text x="100" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Resynchronization SM</text>
    <text x="100" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Zero-TX Safety Boundary</text>
    <text x="100" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">DBC Linear Scaling</text>
  </g>

  <!-- Right: Rust Production Crates -->
  <g transform="translate(560, 20)">
    <rect width="260" height="280" rx="8" fill="url(#boxGrad)" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="260" height="36" rx="8" fill="#dcfce7"/>
    <text x="130" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">FIELD-PROBE RUST CRATES</text>

    <g transform="translate(15, 50)" font-family="monospace" font-size="11">
      <rect width="230" height="40" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="10" y="16" font-weight="bold" fill="#166534">fp-dissectors</text>
      <text x="10" y="30" font-size="10" fill="#4b5563">Modbus, J1939, CANopen, BACnet</text>

      <g transform="translate(0, 50)">
        <rect width="230" height="40" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="10" y="16" font-weight="bold" fill="#166534">fp-inference</text>
        <text x="10" y="30" font-size="10" fill="#4b5563">cansniffer, histogram, bus load, DBC</text>
      </g>

      <g transform="translate(0, 100)">
        <rect width="230" height="40" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="10" y="16" font-weight="bold" fill="#166534">fp-autodetect</text>
        <text x="10" y="30" font-size="10" fill="#4b5563">CRC-16 hunter &amp; silence timing</text>
      </g>

      <g transform="translate(0, 150)">
        <rect width="230" height="40" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="10" y="16" font-weight="bold" fill="#166534">fp-hal / fp-store</text>
        <text x="10" y="30" font-size="10" fill="#4b5563">Strict Tier-0 passive bus tap</text>
      </g>
    </g>
  </g>

  <!-- Connective Arrows -->
  <path d="M 260 160 L 310 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 510 160 L 560 160" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
