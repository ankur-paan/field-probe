<svg width="740" height="280" viewBox="0 0 740 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Hardware Section -->
  <rect x="20" y="20" width="200" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="120" y="48" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Hardware Layer</text>
  <rect x="35" y="70" width="170" height="38" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="120" y="94" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">USB Serial (RS-485)</text>
  <rect x="35" y="120" width="170" height="38" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="120" y="144" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">USB CAN / CAN-FD</text>
  <rect x="35" y="170" width="170" height="38" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="120" y="194" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Synthetic Replay HAL</text>
  <text x="120" y="235" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Tier-0 Passive Default</text>

  <!-- Arrow to Core -->
  <path d="M220 140 H260" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Core Engine -->
  <rect x="260" y="20" width="220" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="370" y="48" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Core Engine</text>
  <rect x="275" y="70" width="190" height="32" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="370" y="91" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="11">fp-autodetect (Baud / CRC)</text>
  <rect x="275" y="110" width="190" height="32" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="370" y="131" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="11">fp-dissectors (Zero-Panic)</text>
  <rect x="275" y="150" width="190" height="32" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="370" y="171" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="11">fp-inference (Signal Map)</text>
  <rect x="275" y="190" width="190" height="32" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="370" y="211" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="11">fp-store (Ring Buffer)</text>

  <!-- Arrow to Interfaces -->
  <path d="M480 140 H520" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- User & Agent Interfaces -->
  <rect x="520" y="20" width="200" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="620" y="48" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Interfaces</text>
  <rect x="535" y="70" width="170" height="48" rx="5" fill="#ecfdf5" stroke="#10b981"/>
  <text x="620" y="94" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-weight="700" font-size="12">fp-mcp Server</text>
  <text x="620" y="108" text-anchor="middle" fill="#047857" font-family="system-ui, sans-serif" font-size="10">10 MCP Diagnostic Tools</text>

  <rect x="535" y="130" width="170" height="42" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="620" y="152" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12">fp-server (Axum)</text>
  <text x="620" y="165" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">REST API + WebSockets</text>

  <rect x="535" y="185" width="170" height="42" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="620" y="207" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12">fp-cli (Ratatui)</text>
  <text x="620" y="220" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Terminal Dashboard</text>
</svg>
