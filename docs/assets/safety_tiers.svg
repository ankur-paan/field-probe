<svg width="680" height="220" viewBox="0 0 680 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Tier 0 -->
  <rect x="30" y="50" width="170" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="82" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Tier 0 (Default)</text>
  <text x="115" y="105" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">PassiveListenOnly</text>
  <rect x="45" y="125" width="140" height="26" rx="4" fill="#fee2e2"/>
  <text x="115" y="142" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-weight="700" font-size="11">TX FORBIDDEN</text>

  <!-- Transition 1 -->
  <path d="M200 110 H240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="98" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Permit</text>

  <!-- Tier 1 -->
  <rect x="250" y="50" width="170" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="335" y="82" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Tier 1</text>
  <text x="335" y="105" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">ReadOnlyProbe</text>
  <rect x="265" y="125" width="140" height="26" rx="4" fill="#fef3c7"/>
  <text x="335" y="142" text-anchor="middle" fill="#b45309" font-family="system-ui, sans-serif" font-weight="600" font-size="10">Device ID / Read Only</text>

  <!-- Transition 2 -->
  <path d="M420 110 H460" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="98" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Token</text>

  <!-- Tier 2 -->
  <rect x="470" y="50" width="170" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="555" y="82" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Tier 2</text>
  <text x="555" y="105" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">ActiveWrite</text>
  <rect x="485" y="125" width="140" height="26" rx="4" fill="#fee2e2"/>
  <text x="555" y="142" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-weight="600" font-size="10">Active Register Writes</text>
</svg>
