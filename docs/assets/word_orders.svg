<svg width="680" height="190" viewBox="0 0 680 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ABCD -->
  <rect x="30" y="30" width="135" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="97" y="58" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-weight="700" font-size="13">ABCD</text>
  <text x="97" y="76" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="10">Big-Endian (Standard)</text>

  <!-- CDAB -->
  <rect x="185" y="30" width="135" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="252" y="58" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-weight="700" font-size="13">CDAB</text>
  <text x="252" y="76" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="10">Word Swapped (Modbus)</text>

  <!-- BADC -->
  <rect x="340" y="30" width="135" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="407" y="58" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-weight="700" font-size="13">BADC</text>
  <text x="407" y="76" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="10">Byte Swapped</text>

  <!-- DCBA -->
  <rect x="495" y="30" width="135" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="562" y="58" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-weight="700" font-size="13">DCBA</text>
  <text x="562" y="76" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="10">True Little-Endian</text>

  <rect x="30" y="115" width="600" height="45" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="330" y="142" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11">Plausibility Scoring: Ranks physical sensor smooth trajectories over erratic floats</text>
