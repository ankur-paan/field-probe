<svg width="720" height="260" viewBox="0 0 720 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Client Side -->
  <rect x="30" y="30" width="160" height="200" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="60" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-weight="700" font-size="14">AI Agent / Client</text>
  <rect x="45" y="80" width="130" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="100" text-anchor="middle" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="11">Claude / Cursor</text>
  <rect x="45" y="125" width="130" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="145" text-anchor="middle" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="11">Field Web UI</text>
  <rect x="45" y="170" width="130" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="190" text-anchor="middle" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="11">Remote SCADA</text>

  <!-- Channels -->
  <!-- REST Channel -->
  <line x1="190" y1="80" x2="350" y2="80" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="270" y="72" text-anchor="middle" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">GET /health, /api/v1/*</text>
  <line x1="350" y1="105" x2="190" y2="105" stroke="#059669" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="270" y="120" text-anchor="middle" fill="#059669" font-family="system-ui, sans-serif" font-size="10">HTTP 200 OK (JSON)</text>

  <!-- SSE / WebSocket Channel -->
  <line x1="350" y1="165" x2="190" y2="165" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="270" y="155" text-anchor="middle" fill="#7c3aed" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Real-Time Telemetry (SSE)</text>
  <text x="270" y="180" text-anchor="middle" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="10">data: { registers, bus_load }</text>

  <!-- Server Side (fp-server) -->
  <rect x="350" y="30" width="340" height="200" rx="8" fill="#f8fafc" stroke="#10b981" stroke-width="2"/>
  <text x="520" y="60" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-weight="700" font-size="14">field-probe Telemetry Engine (fp-server)</text>

  <!-- Endpoints inside server -->
  <rect x="370" y="80" width="140" height="32" rx="4" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/>
  <text x="440" y="100" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">/health</text>

  <rect x="530" y="80" width="140" height="32" rx="4" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/>
  <text x="600" y="100" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">/api/v1/dongles</text>

  <rect x="370" y="125" width="140" height="32" rx="4" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/>
  <text x="440" y="145" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">/api/v1/bus/summary</text>

  <rect x="530" y="125" width="140" height="32" rx="4" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/>
  <text x="600" y="145" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">/api/v1/catalog</text>

  <!-- Invariant Bar -->
  <rect x="370" y="175" width="300" height="35" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="520" y="197" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Strict Safety Invariant: Tier-0 Zero-TX Active</text>
</svg>
